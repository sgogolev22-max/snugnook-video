name: Render video pins

on:
  schedule:
    - cron: '17 */4 * * *'   # every 4 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install pillow==11.0.0 imageio-ffmpeg==0.5.1
      - name: Render pending videos
        run: python run.py
      - name: Publish videos as release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls out/*.mp4 >/dev/null 2>&1; then
            gh release view videos >/dev/null 2>&1 || gh release create videos --title "Video pins" --notes "Rendered video pins for thesnugnook.com"
            gh release upload videos out/*.mp4 --clobber
          fi
          if ls out-fresh/*.mp4 >/dev/null 2>&1; then
            gh release view fresh-videos >/dev/null 2>&1 || gh release create fresh-videos --title "Fresh Nook video pins" --notes "Rendered video pins for thefreshnook.com"
            gh release upload fresh-videos out-fresh/*.mp4 --clobber
          fi
      - name: Save progress
        run: |
          git config user.name "snugnook-video"
          git config user.email "snugnook-video@users.noreply.github.com"
          git add done.json done-fresh.json
          git diff --cached --quiet || (git commit -m "Rendered video pins" && git push)
      # Pinterest cannot always download the MP4 from the sites or from the release (redirect, octet-stream),
      # so every release file is mirrored to GitHub Pages: a plain HTTPS URL served as video/mp4.
      #   https://<owner>.github.io/<repo>/fresh/video-<id>.mp4   (Fresh Nook)
      #   https://<owner>.github.io/<repo>/snug/video-<id>.mp4    (Snug Nook)
      - name: Mirror videos to GitHub Pages (gh-pages branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf pages && mkdir pages && cd pages
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin gh-pages; then git checkout -q -b gh-pages FETCH_HEAD; else git checkout -q --orphan gh-pages; fi
          mkdir -p fresh snug
          touch .nojekyll
          gh release download fresh-videos -p 'video-*.mp4' -D fresh --skip-existing -R "$GITHUB_REPOSITORY" || true
          gh release download videos -p 'video-*.mp4' -D snug --skip-existing -R "$GITHUB_REPOSITORY" || true
          printf '<!doctype html><title>Nook video pins</title><p>Video files for thesnugnook.com and thefreshnook.com Pinterest pins.</p>\n' > index.html
          git add -A
          git -c user.name=snugnook-video -c user.email=snugnook-video@users.noreply.github.com commit -q -m "Mirror video files" || exit 0
          git push -q origin gh-pages
